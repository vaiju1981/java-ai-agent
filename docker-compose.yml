services:
  analytics-app:
    build:
      context: .
      dockerfile: demos/analytics-ui/Dockerfile
    environment:
      ANALYTICS_HOST: 0.0.0.0
      ANALYTICS_PORT: 8080
      ANALYTICS_WORKSPACE: /app/workspace
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
    ports:
      - "8080:8080"
    volumes:
      - ./workspace:/app/workspace
